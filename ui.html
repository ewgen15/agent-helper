<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Копіювання виділених нодів</title>
<style>
  /* ---- Tokens: light only (design/DESIGN-PRINCIPLES.md). The plugin never follows the Figma theme. ---- */
  :root {
    color-scheme: light;
    --bg-a: #fde3d6;          /* персиковий */
    --bg-b: #ece4fb;          /* лавандовий */
    --bg-c: #d9ebfd;          /* блакитний */
    --card: rgba(255, 255, 255, 0.78);
    --card-solid: #ffffff;
    --card-edge: rgba(255, 255, 255, 0.85);
    --line: rgba(27, 29, 42, 0.10);
    --fg: #1b1d2a;            /* ~13:1 на картці */
    --muted: #555b6e;         /* ~6:1 на картці й фоні */
    --accent: #0a66f0;        /* єдиний яскравий акцент, білий текст ~5:1 */
    --accent-fg: #ffffff;
    --disabled-bg: #e3e5ec;   /* disabled: сірий фон + --muted, без opacity */
    --ok: #13703a;
    --err: #a4191b;
    --err-bg: #ffe0df;
    --dot-off: #6b7184;       /* сірий індикатор «вимкнено», неактивний текст-сірий */
    --warn: #7a4b00;          /* ~6:1 на фоні */
    --tile-blue: #cfe4ff;   --tile-blue-fg: #0a3d8c;
    --tag-text-bg: #ffe6d6; --tag-text-fg: #7d3b12;
    --tag-inst-bg: #ebe2ff; --tag-inst-fg: #4a2c9c;
    --tag-comp-bg: #d9f6e3; --tag-comp-fg: #15602f;
    --tag-frame-bg: #dbe9ff; --tag-frame-fg: #174a94;
    --link: #0857c9;          /* текстові посилання-кнопки (design/DESIGN-PRINCIPLES.md) */
    --shadow-sm: 0 4px 14px rgba(70, 60, 130, 0.07);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background:
      radial-gradient(circle at 18% 0%, rgba(255, 255, 255, 0.65), transparent 55%),
      linear-gradient(165deg, var(--bg-a) 0%, var(--bg-b) 48%, var(--bg-c) 100%);
    background-color: var(--bg-b);
    color: var(--fg);
    font: 12px/1.4 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* The window has a fixed size (380x520, see code.ts): the header and the tab bar stay put and #content scrolls. */
  .wrap { padding: 12px; display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex: none; min-width: 0; }
  .head-start { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .head h1 {
    margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Server status dot next to the title: a 24px click target with a 10px coloured disc.
     The state is also in aria-label and title, so colour is not the only signal. */
  .health-dot {
    flex: none; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 999px; background: transparent;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .health-dot::before { content: ""; width: 10px; height: 10px; border-radius: 999px; background: var(--dot-off); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9); }
  .health-dot.ok::before { background: var(--ok); }
  .health-dot.err::before { background: var(--err); }
  .health-dot:hover { background: rgba(255, 255, 255, 0.6); }
  /* Decorative logo: the simplified icon (design/icon/agent-helper-icon-small.svg), fixed colours. */
  .head .logo { display: inline-block; flex: none; width: 22px; height: 22px; margin-right: 8px; vertical-align: middle; }
  .head-end { display: flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; }
  .head-end .count {
    display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px;
    background: var(--card-solid); border: 1px solid var(--line);
    color: var(--muted); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #collapseBtn { padding: 4px 10px; font-size: 11px; }

  /* Scroll area under the fixed header and tab bar. */
  .content {
    display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain; padding: 2px 4px 0; scrollbar-width: thin;
  }
  /* The bottom gap lives on the panel, not on #content: the selection tab's sticky footer must reach the bottom edge. */
  .panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: none; padding-bottom: 16px; }
  #panelSelection { padding-bottom: 0; }
  /* Selection tab: the sticky footer (comment, «Відправити деталі», status) stays at the bottom while the list scrolls. */
  .sel-footer {
    position: sticky; bottom: 0; z-index: 1;
    display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--card-edge); border-bottom: 0; border-radius: 16px 16px 0 0;
    box-shadow: 0 -8px 20px rgba(70, 60, 130, 0.12);
  }
  /* The copy controls: a collapsed block at the bottom of the scrollable part. */
  .copy-block > summary { cursor: pointer; color: var(--muted); font-weight: 700; padding: 2px 0; }
  .copy-body { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
  /* Collapsed: only the header row stays visible (code.ts resizes the window to 56 px). */
  body.collapsed .content,
  body.collapsed .tabs { display: none; }

  /* Floating pill tab bar, fixed above the scroll area. */
  .tabs {
    flex: none; min-width: 0; display: flex; gap: 2px; padding: 3px;
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 999px;
    box-shadow: 0 4px 14px rgba(70, 60, 130, 0.08);
  }
  .tab {
    flex: 1 1 0; min-width: 0; border: 0; border-radius: 999px; background: transparent;
    padding: 6px 6px; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .tab:hover { color: var(--fg); background: rgba(255, 255, 255, 0.6); }
  .tab[aria-selected="true"] {
    background: var(--accent); color: var(--accent-fg); box-shadow: 0 4px 10px rgba(10, 102, 240, 0.25);
  }

  /* Cards: translucent surface over the gradient. Nothing is nested inside another card. */
  /* The list grows with its content: the whole tab scrolls as one area (#content), no inner scrollbar. */
  .list {
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 16px;
    box-shadow: var(--shadow-sm); padding: 4px;
  }
  .item {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 6px; row-gap: 2px; align-items: center;
    padding: 6px 8px;
  }
  .item + .item { border-top: 1px solid var(--line); }
  .item .name { grid-column: 1; grid-row: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .tag { grid-column: 2; grid-row: 1; }
  .item .meta { grid-column: 1 / -1; grid-row: 2; min-width: 0; color: var(--muted); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .empty { padding: 12px 8px; color: var(--muted); text-align: center; font-weight: 600; }

  /* Node-type tags: pastel pairs from the principles file; unknown types get the neutral pair. */
  .tag {
    flex: none; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 800;
    letter-spacing: 0.03em; white-space: nowrap; background: var(--card-solid); color: var(--muted);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .tag.t-text { background: var(--tag-text-bg); color: var(--tag-text-fg); box-shadow: none; }
  .tag.t-inst { background: var(--tag-inst-bg); color: var(--tag-inst-fg); box-shadow: none; }
  .tag.t-comp { background: var(--tag-comp-bg); color: var(--tag-comp-fg); box-shadow: none; }
  .tag.t-frame { background: var(--tag-frame-bg); color: var(--tag-frame-fg); box-shadow: none; }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { color: var(--muted); font-weight: 700; }
  select, input[type="password"], textarea {
    font: inherit; font-size: 12px; color: var(--fg); width: 100%;
    background: var(--card-solid); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px;
  }
  textarea { resize: vertical; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; }
  .check input { width: 14px; height: 14px; margin: 0; flex: none; accent-color: var(--accent); }
  /* The settings tab: one card holding the send switch, the format, the token and the server status. */
  .settings-card {
    display: flex; flex-direction: column; gap: 10px; padding: 10px;
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 16px; box-shadow: var(--shadow-sm);
  }
  .expand-check:has(input:disabled) { color: var(--muted); cursor: not-allowed; }
  .expand-check input:disabled { cursor: not-allowed; }

  /* Buttons: pills. Primary = the one accent; disabled = grey + muted text, no opacity. */
  button { font: inherit; font-weight: 700; color: var(--fg); cursor: pointer; }
  button.primary {
    white-space: nowrap; flex-shrink: 0; background: var(--accent); color: var(--accent-fg);
    border: 1px solid transparent; border-radius: 999px; padding: 7px 14px;
    box-shadow: 0 4px 12px rgba(10, 102, 240, 0.25);
  }
  button.primary:not(:disabled):hover { box-shadow: 0 6px 16px rgba(10, 102, 240, 0.38); }
  button.secondary {
    white-space: nowrap; flex-shrink: 0; background: rgba(255, 255, 255, 0.9); color: var(--fg);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
  }
  button.secondary:not(:disabled):hover { background: #ffffff; box-shadow: 0 2px 8px rgba(70, 60, 130, 0.12); }
  button:disabled,
  button.primary:disabled,
  button.secondary:disabled {
    background: var(--disabled-bg); color: var(--muted); border-color: transparent; box-shadow: none; cursor: not-allowed;
  }

  .comment-box { display: flex; flex-direction: column; gap: 6px; }
  .comment-head { display: flex; justify-content: space-between; align-items: baseline; }
  .comment-head label { color: var(--muted); font-weight: 700; }
  .comment-head .count { color: var(--muted); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .records-head { display: flex; justify-content: flex-end; align-items: center; gap: 8px; min-width: 0; }
  .records-summary { margin-right: auto; color: var(--muted); font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .records-head button { flex: none; white-space: nowrap; }
  .hint { color: var(--muted); font-weight: 600; font-size: 11px; }
  .records-list { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .records-empty {
    padding: 10px; background: var(--card); border: 1px solid var(--card-edge); border-radius: 14px;
    box-shadow: var(--shadow-sm); color: var(--muted); text-align: center; font-weight: 600;
  }
  /* Record card: one translucent surface. The open part is a real button; the status button sits below it. */
  .rec {
    min-width: 0; background: var(--card); border: 1px solid var(--card-edge); border-radius: 14px; box-shadow: var(--shadow-sm);
  }
  .rec:hover { background: rgba(255, 255, 255, 0.92); }
  .rec-open {
    display: flex; flex-direction: column; gap: 6px; width: 100%; min-width: 0; padding: 10px 12px 6px;
    background: none; border: none; border-radius: 14px 14px 0 0; text-align: left; cursor: pointer; font: inherit; color: var(--fg);
  }
  .rec-title {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 5px; min-width: 0;
    font-size: 13px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere;
  }
  .rec-el { display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; }
  .rec-el .tag { font-size: 9px; padding: 1px 6px; }
  .rec-el .nm { overflow-wrap: anywhere; }
  .rec-sep { margin-left: -4px; color: var(--muted); font-weight: 700; }
  .rec-more { color: var(--muted); font-weight: 700; }
  .rec-count { color: var(--muted); font-size: 11px; font-weight: 700; white-space: nowrap; }
  .rec-note {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; font-weight: 600; color: var(--fg);
  }
  .rec-note.empty { color: var(--muted); font-style: italic; font-weight: 700; }
  .rec-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 700; }
  .rec-time { font-variant-numeric: tabular-nums; }
  .rec-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 12px 10px; }
  .rec-actions button { font-size: 11px; padding: 4px 10px; white-space: nowrap; flex: none; }
  /* «Виділити у Figma»: a button and its result line; the line is hidden while empty. */
  .select-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
  .select-status { min-height: 0; font-size: 11px; overflow-wrap: anywhere; }
  .select-status:empty { display: none; }
  /* Badges: нове = blue pastel, виконано = neutral. */
  .badge {
    flex: none; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; white-space: nowrap;
    background: var(--card-solid); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line);
  }
  .badge-new { background: var(--tile-blue); color: var(--tile-blue-fg); box-shadow: none; }
  .badge-done { background: var(--card-solid); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
  /* Done cards are muted by colour (not opacity). */
  .rec.done .rec-title, .rec.done .rec-note, .rec.done .rec-meta { color: var(--muted); }
  /* Link-style text buttons (≥24 px target, accent-free: --link is the text link colour). */
  .link-btn {
    min-height: 24px; padding: 2px 6px; background: none; border: 0; border-radius: 8px;
    color: var(--link); font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .link-btn:hover { background: rgba(255, 255, 255, 0.7); text-decoration: underline; }

  /* The record view: one card under a back button. */
  .rec-view { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .rec-view-back { align-self: flex-start; }
  .rec-view-card {
    display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 12px;
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 16px; box-shadow: var(--shadow-sm);
  }
  .rec-view-title {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0;
    font-size: 15px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere;
  }
  .rec-view-el {
    display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 2px 8px 2px 3px; border-radius: 999px;
    background: var(--card-solid); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; font-weight: 700;
  }
  .rec-view-el .tag { font-size: 9px; padding: 1px 6px; }
  .rec-view-el .nm { overflow-wrap: anywhere; }
  .rec-view-more { color: var(--muted); font-size: 12px; font-weight: 700; }
  .rec-view-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 700; }
  .rec-view-label { color: var(--muted); font-size: 11px; font-weight: 700; }
  .rec-view-note { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; font-weight: 600; color: var(--fg); }
  .rec-view-note.empty { color: var(--muted); font-style: italic; font-weight: 700; }
  .rec-view-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .rec-tech { display: flex; flex-direction: column; gap: 2px; min-width: 0; color: var(--muted); font-size: 11px; font-weight: 600; overflow-wrap: anywhere; }
  .rec-tech[hidden] { display: none; }

  /* Current row ("Поточне"): a toggle with its node list. */
  .rec-row {
    display: flex; flex-direction: column; gap: 4px; width: 100%; min-width: 0;
    padding: 6px 8px; background: none; border: none; border-radius: 12px; text-align: left;
    cursor: pointer; font: inherit; color: var(--fg);
  }
  .rec-row:hover { background: rgba(255, 255, 255, 0.7); }
  .rec-line { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .rec-first { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; font-weight: 700; }
  .rec-detail { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 8px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .rec-node { overflow-wrap: anywhere; }

  /* Children of the selected nodes: a row of pills under the node row. */
  .list.compact .item { padding: 4px 8px; }
  .list.compact .meta { display: none; }
  .kids { grid-column: 1 / -1; grid-row: 3; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kids:empty { display: none; }
  .kid-list { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; }
  .kid {
    display: inline-flex; align-items: center; gap: 4px; max-width: 100%; min-width: 0;
    padding: 1px 8px 1px 2px; border-radius: 999px; background: var(--card-solid);
    box-shadow: inset 0 0 0 1px var(--line); font-size: 11px; font-weight: 600;
  }
  .kid .tag { font-size: 9px; padding: 1px 5px; }
  .kid .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kid-rest { color: var(--muted); font-size: 11px; font-weight: 600; }

  /* "Поточне": a dashed tile above the saved records; it is not a record and is not counted. */
  .records-current { background: var(--card-solid); border: 1px dashed var(--line); border-radius: 14px; padding: 4px 0; }
  .rec-cur-line { padding: 8px 10px; color: var(--fg); font-weight: 600; overflow-wrap: anywhere; }
  .rec-cur-label { color: var(--muted); font-style: italic; font-weight: 700; }
  .records-current .rec-row { padding-top: 8px; }
  .records-current .rec-detail { padding-top: 2px; }

  .status { min-height: 16px; font-weight: 800; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status.err:not(:empty) { background: var(--err-bg); border-radius: 12px; padding: 6px 10px; }
  .health { min-height: 16px; font-weight: 800; }
  .health.ok { color: var(--ok); }
  .health.warn { color: var(--warn); }
  .health.err { color: var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="head-start">
      <h1><svg class="logo" width="22" height="22" viewBox="0 0 128 128" aria-hidden="true" focusable="false"><rect width="128" height="128" rx="28" fill="#0a66f0"/><rect x="26" y="34" width="76" height="56" rx="24" fill="#ffffff"/><path d="M40 84 L30 106 L62 90 Z" fill="#ffffff"/><circle cx="48" cy="62" r="10" fill="#0a66f0"/><path d="M74 62 H86" stroke="#0a66f0" stroke-width="14" stroke-linecap="round"/></svg>Виділені ноди</h1>
      <button id="healthDot" class="health-dot off" type="button" aria-label="Стан сервера: надсилання в Claude вимкнено" title="Стан сервера: надсилання в Claude вимкнено"></button>
    </div>
    <div class="head-end">
      <span id="countWrap" class="count">Вибрано: <span id="count">0</span></span>
      <span id="summary" class="count" hidden></span>
      <button id="collapseBtn" class="secondary" type="button" aria-expanded="true" aria-controls="content">▾ Згорнути</button>
    </div>
  </div>

  <div id="tablist" class="tabs" role="tablist" aria-label="Розділи">
    <button id="tabSelection" class="tab" type="button" role="tab" aria-selected="true" aria-controls="panelSelection" tabindex="0">Виділення</button>
    <button id="tabRecords" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panelRecords" tabindex="-1"><span id="recordsTabLabel">Записи</span></button>
    <button id="tabSettings" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panelSettings" tabindex="-1">Налаштування</button>
  </div>

  <div id="content" class="content">
    <div id="panelSelection" class="panel" role="tabpanel" aria-labelledby="tabSelection">
  <div id="list" class="list"></div>

  <label class="check expand-check" title="Показати вміст інстансів (більше токенів)">
    <input type="checkbox" id="expandInstances" aria-label="Розгортати інстанси: показати вміст інстансів (більше токенів)" disabled>
    <span>Розгортати інстанси</span>
  </label>

  <details id="copyBlock" class="copy-block">
    <summary>Копіювання</summary>
    <div class="copy-body">
      <div class="hint">Формат копіювання — в налаштуваннях</div>
      <label class="check">
        <input type="checkbox" id="auto">
        <span>Автокопіювання при виборі</span>
      </label>
      <button id="copy" class="primary" disabled>Копіювати</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>
  </details>

  <div class="sel-footer">
    <div class="comment-box">
      <div class="comment-head">
        <label for="comment">Коментар для Claude</label>
        <span id="commentCount" class="count">0/2000</span>
      </div>
      <textarea id="comment" rows="2" maxlength="2000" placeholder="Коментар для Claude…"></textarea>
    </div>

    <button id="detailBtn" class="primary" type="button" disabled>Відправити деталі</button>

    <div id="sendStatus" class="status" role="status" aria-live="polite"></div>
  </div>
    </div>

    <div id="panelRecords" class="panel" role="tabpanel" aria-labelledby="tabRecords" hidden>
      <div class="records-head">
        <span id="recordsSummary" class="records-summary"></span>
        <button id="recordsRefresh" class="secondary" type="button" disabled aria-label="Оновити список записів на сервері">Оновити</button>
      </div>
      <div id="recordsHint" class="hint" hidden>Увімкніть надсилання й введіть токен</div>
      <div id="recordsStatus" class="status" role="status" aria-live="polite"></div>
      <div id="recordsCurrent" class="records-current" hidden></div>
      <div id="recordsList" class="records-list"></div>
      <div id="recordView" class="rec-view" hidden>
        <button id="recordBack" class="secondary rec-view-back" type="button">← Назад до записів</button>
        <div id="recordViewBody" class="rec-view-card"></div>
      </div>
    </div>

    <div id="panelSettings" class="panel" role="tabpanel" aria-labelledby="tabSettings" hidden>
      <div class="settings-card">
        <label class="check">
          <input type="checkbox" id="send" aria-describedby="sendHint">
          <span>Надсилати в Claude (localhost)</span>
        </label>
        <div id="sendHint" class="hint">Передає виділення на локальний сервер, порт 3846.</div>

        <div class="field">
          <label for="format">Формат</label>
          <select id="format" aria-describedby="formatHint">
            <option value="id">id</option>
            <option value="idname">id + name</option>
            <option value="link">link</option>
            <option value="claude">Claude text</option>
          </select>
          <div id="formatHint" class="hint">Вигляд тексту для кнопки «Копіювати».</div>
        </div>

        <div class="field">
          <label for="token">Токен</label>
          <input type="password" id="token" autocomplete="off" spellcheck="false" aria-describedby="tokenHint">
          <div id="tokenHint" class="hint">Той самий токен, що задано для локального сервера.</div>
        </div>

        <div id="health" class="health" role="status" aria-live="polite" hidden></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var state = { fileKey: null, nodes: [] };
  var userGestured = false;
  var lastSignature = null;

  var countEl = document.getElementById('count');
  var listEl = document.getElementById('list');
  var formatEl = document.getElementById('format');
  var autoEl = document.getElementById('auto');
  var copyBtn = document.getElementById('copy');
  var statusEl = document.getElementById('status');
  var sendEl = document.getElementById('send');
  var tokenEl = document.getElementById('token');
  var sendStatusEl = document.getElementById('sendStatus');
  var healthEl = document.getElementById('health');
  var healthDotEl = document.getElementById('healthDot');
  var detailBtn = document.getElementById('detailBtn');
  var commentEl = document.getElementById('comment');
  var commentCountEl = document.getElementById('commentCount');
  var expandEl = document.getElementById('expandInstances');

  // Format values of the format select; a stored format outside this list is ignored (see applySettings).
  var FORMAT_VALUES = ['id', 'idname', 'link', 'claude'];

  // Detail collection: the plugin builds the Compact Dump on click. The comment is kept in memory only.
  var COMMENT_MAX = 2000;
  var DETAIL_TIMEOUT_MS = 5000;
  var DETAIL_WAIT_TEXT = 'Збираю деталі…';
  var detailSeq = 0;
  // The request in progress: {requestId, key, note, commentRaw, posting, timer} or null.
  var detail = null;
  var selectionKey = null;

  // Pastel tag class per node type (see the .tag rules in the style block); other types get .t-other.
  var NODE_TAG_CLASS = { TEXT: 't-text', INSTANCE: 't-inst', COMPONENT: 't-comp', FRAME: 't-frame' };

  var SEND_URL = 'http://localhost:3846/selection';
  var SEND_TIMEOUT_MS = 2000;
  var sendSeq = 0;

  var HEALTH_URL = 'http://localhost:3846/health';
  var HEALTH_TIMEOUT_MS = 1500;
  var HEALTH_INTERVAL_MS = 3000;
  var HEALTH_DEBOUNCE_MS = 400;
  var healthTimer = null;
  var healthDebounce = null;
  var healthSeq = 0;
  var HEALTH_STATES = {
    ok: { text: '● Сервер працює', kind: 'ok' },
    badToken: { text: '● Сервер працює, невірний токен', kind: 'warn' },
    noToken: { text: '● Сервер працює, введіть токен', kind: 'warn' },
    down: { text: '● Сервер не запущений', kind: 'err' }
  };

  // ---- Records on the server (GET /records): the Записи tab with the list of the last selections ----

  var tablistEl = document.getElementById('tablist');
  var tabSelectionEl = document.getElementById('tabSelection');
  var tabRecordsEl = document.getElementById('tabRecords');
  var tabSettingsEl = document.getElementById('tabSettings');
  var recordsTabLabelEl = document.getElementById('recordsTabLabel');
  var panelSelectionEl = document.getElementById('panelSelection');
  var panelRecordsEl = document.getElementById('panelRecords');
  var panelSettingsEl = document.getElementById('panelSettings');
  // Tab names in tab-bar order; each name maps to its tab button and its panel.
  var TAB_ORDER = ['selection', 'records', 'settings'];
  var tabEls = {
    selection: { tab: tabSelectionEl, panel: panelSelectionEl },
    records: { tab: tabRecordsEl, panel: panelRecordsEl },
    settings: { tab: tabSettingsEl, panel: panelSettingsEl }
  };
  var activeTab = 'selection'; // session only, never persisted
  var recordsRefreshEl = document.getElementById('recordsRefresh');
  var recordsHintEl = document.getElementById('recordsHint');
  var recordsStatusEl = document.getElementById('recordsStatus');
  var recordsListEl = document.getElementById('recordsList');
  var recordsCurrentEl = document.getElementById('recordsCurrent');
  var recordsSummaryEl = document.getElementById('recordsSummary');

  var RECORDS_URL = 'http://localhost:3846/records';
  var RECORDS_TIMEOUT_MS = 2000;
  var RECORDS_DEBOUNCE_MS = 400;
  var recordsData = null; // last successful list, newest first; null until the first load
  var recordsCurrent = null; // last "current" from GET /records (null: nothing has arrived yet, or the server sent null)
  var recordsCurrentExpanded = false; // session only
  var recordsExpanded = {}; // session only: record id -> expanded
  var recordsSeq = 0;
  var recordsDebounce = null;
  var RECORD_STATUS_TIMEOUT_MS = 2000;
  var recordStatusPending = {}; // session only: record id -> true while its status POST is in flight

  function recordsActive() {
    return sendEl.checked && tokenEl.value.trim() !== '';
  }

  function setRecordsStatus(text, kind) {
    recordsStatusEl.textContent = text;
    recordsStatusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function makeEl(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function textOf(v) {
    return v === undefined || v === null ? '' : String(v);
  }

  function pad2(n) {
    return n < 10 ? '0' + n : String(n);
  }

  function formatTime(value) {
    var d = typeof value === 'string' ? new Date(value) : null;
    if (!d || isNaN(d.getTime())) return '--:--:--';
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  function fileLabel(fileKey) {
    return typeof fileKey === 'string' && fileKey ? fileKey.slice(0, 6) + '…' : 'файл невідомий';
  }

  // ---- Children of the selected nodes (Виділення tab) ----

  // Pills shown per node before «ще N»; more than COMPACT_AFTER selected nodes switch the rows to the compact layout.
  var CHILDREN_SHOWN = 4;
  var COMPACT_AFTER = 2;
  // Session only, per node id; both maps are dropped when the set of selected ids changes.
  var childExpanded = {}; // every child that was sent is shown
  var childOpen = {}; // compact layout: the «N дочірніх» toggle is open

  // Ukrainian plural: 1, 21 -> one; 2-4, 22-24 -> few; everything else, 11-14 included -> many.
  function plural(n, one, few, many) {
    var mod10 = n % 10;
    var mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return one;
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
    return many;
  }

  // Ukrainian plural of "вузол": 1, 21 -> вузол; 2-4, 22-24 -> вузли; everything else, 11-14 included -> вузлів.
  function nodesWord(n) {
    return plural(n, 'вузол', 'вузли', 'вузлів');
  }

  function elementsWord(n) {
    return plural(n, 'елемент', 'елементи', 'елементів');
  }

  function childrenWord(n) {
    return plural(n, 'дочірній', 'дочірні', 'дочірніх');
  }

  function nodeName(n) {
    return typeof n.name === 'string' && n.name ? n.name : '(без назви)';
  }

  // The pastel class for a known node type; any other type gets the neutral pair.
  function tagClass(type) {
    return Object.prototype.hasOwnProperty.call(NODE_TAG_CLASS, type) ? NODE_TAG_CLASS[type] : 't-other';
  }

  function tagEl(type) {
    return makeEl('span', 'tag ' + tagClass(type), textOf(type));
  }

  // A type tag and a name in one pill; the name is the .nm span (ellipsis or wrapping is set in CSS per place).
  function nameChip(n, cls) {
    var chip = makeEl('span', cls);
    if (textOf(n.type)) chip.appendChild(tagEl(n.type));
    chip.appendChild(makeEl('span', 'nm', nodeName(n)));
    return chip;
  }

  // The children of one node as the plugin sent them. A missing or broken field counts as "none".
  // total is never below the number of children actually sent.
  function childInfo(n) {
    var sent = Array.isArray(n.children) ? n.children.filter(function (c) { return c && typeof c === 'object'; }) : [];
    var reported = typeof n.childCount === 'number' && isFinite(n.childCount) && n.childCount > 0 ? Math.floor(n.childCount) : 0;
    return { sent: sent, total: Math.max(reported, sent.length) };
  }

  // Fills the children holder of one row (the holder stays in the DOM, so only its content is rebuilt).
  // Compact layout: a «N дочірніх» toggle first. The pills follow when the layout is roomy or the toggle is open.
  // focus names the button to focus after the rebuild ('toggle' or 'more'), so keyboard focus stays on it.
  function fillKids(holder, n, compact, focus) {
    var id = textOf(n.id);
    var info = childInfo(n);
    holder.textContent = '';
    if (info.total === 0) return;
    var open = !compact || childOpen[id] === true;
    if (compact) {
      var toggle = makeEl('button', 'link-btn', info.total + ' ' + childrenWord(info.total));
      toggle.type = 'button';
      toggle.setAttribute('aria-expanded', String(open));
      toggle.addEventListener('click', function () {
        childOpen[id] = !open;
        fillKids(holder, n, compact, 'toggle');
      });
      holder.appendChild(toggle);
      if (focus === 'toggle') toggle.focus();
    }
    if (!open) return;
    var expanded = childExpanded[id] === true;
    var shown = expanded ? info.sent : info.sent.slice(0, CHILDREN_SHOWN);
    var pills = makeEl('div', 'kid-list');
    shown.forEach(function (c) {
      pills.appendChild(nameChip(c, 'kid'));
    });
    var more = null;
    if (info.total > CHILDREN_SHOWN) {
      more = makeEl('button', 'link-btn', expanded ? 'згорнути' : 'ще ' + (info.total - CHILDREN_SHOWN));
      more.type = 'button';
      more.setAttribute('aria-expanded', String(expanded));
      more.addEventListener('click', function () {
        childExpanded[id] = !expanded;
        fillKids(holder, n, compact, 'more');
      });
      pills.appendChild(more);
    }
    holder.appendChild(pills);
    if (expanded && info.total > info.sent.length) {
      holder.appendChild(makeEl('div', 'kid-rest', '…і ще ' + (info.total - info.sent.length)));
    }
    if (focus === 'more' && more) more.focus();
  }

  function buildSelectionRow(n, compact) {
    var row = makeEl('div', 'item');
    row.appendChild(makeEl('span', 'name', nodeName(n)));
    row.appendChild(tagEl(n.type));
    row.appendChild(makeEl('span', 'meta', textOf(n.id) + ' · ' + textOf(n.type)));
    var kids = makeEl('div', 'kids');
    fillKids(kids, n, compact, null);
    row.appendChild(kids);
    return row;
  }

  // ---- Time labels for the records ----

  function dayStart(ms) {
    var d = new Date(ms);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  function formatDate(d) {
    return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear();
  }

  // «щойно», «5 хв тому», «3 год тому» (same local day), «вчора», else the local date dd.mm.yyyy.
  function relativeTime(value, now) {
    var d = typeof value === 'string' ? new Date(value) : null;
    if (!d || isNaN(d.getTime())) return 'невідомо';
    var diff = now - d.getTime();
    if (diff < 60000) return 'щойно';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' хв тому';
    var today = new Date(now);
    today.setHours(0, 0, 0, 0);
    var yesterday = new Date(today.getTime());
    yesterday.setDate(yesterday.getDate() - 1);
    var day = dayStart(d.getTime());
    if (day === today.getTime()) return Math.floor(diff / 3600000) + ' год тому';
    if (day === yesterday.getTime()) return 'вчора';
    return formatDate(d);
  }

  // Full local date and time for the record view: dd.mm.yyyy HH:MM.
  function formatDateTime(value) {
    var d = typeof value === 'string' ? new Date(value) : null;
    if (!d || isNaN(d.getTime())) return 'невідомо';
    return formatDate(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  // The tab label, the refresh button and the hint/list/view visibility follow the send settings and the view state.
  function updateRecordsUi() {
    var active = recordsActive();
    // Turning sending off closes an open record view.
    if (!active) openedRecordKey = null;
    // The count is known only after a successful load; before that the tab shows just "Записи".
    // Only records with status "new" are counted; the header gives "N нових з M" (M = all saved records).
    var newCount = recordsData ? recordsData.filter(function (r) { return r.status === 'new'; }).length : 0;
    recordsTabLabelEl.textContent = recordsData ? 'Записи (' + newCount + ')' : 'Записи';
    recordsSummaryEl.textContent = recordsData ? newCount + ' нових з ' + recordsData.length : '';
    recordsRefreshEl.disabled = !active;
    recordsHintEl.hidden = active;
    // The record view replaces the current row and the list while it is open.
    var viewing = openedRecordKey !== null && findRecord(openedRecordKey) !== null;
    recordsListEl.hidden = !active || viewing;
    recordsCurrentEl.hidden = !active || !recordsData || viewing;
    recordViewEl.hidden = !viewing;
    renderRecordView();
  }

  function nodeLine(n) {
    return textOf(n.id) + ' · ' + nodeName(n) + ' · ' + textOf(n.type);
  }

  // The "Поточне" row above the saved records. It is not a record and is not counted in the header.
  // null: nothing has arrived. empty: the current selection is empty. Otherwise a toggle shows the nodes.
  function renderCurrent() {
    var cur = recordsCurrent;
    recordsCurrentEl.textContent = '';
    if (!cur) {
      var none = makeEl('div', 'rec-cur-line');
      none.appendChild(makeEl('span', 'rec-cur-label', 'Поточне'));
      none.appendChild(makeEl('span', 'rec-cur-text', ': ще не надходило'));
      recordsCurrentEl.appendChild(none);
      return;
    }
    if (cur.empty === true) {
      var empty = makeEl('div', 'rec-cur-line');
      empty.appendChild(makeEl('span', 'rec-cur-label', 'Поточне'));
      empty.appendChild(makeEl('span', 'rec-cur-text', ': порожнє'));
      recordsCurrentEl.appendChild(empty);
      return;
    }
    var nodes = Array.isArray(cur.nodes) ? cur.nodes.filter(function (n) { return n && typeof n === 'object'; }) : [];
    var count = typeof cur.nodeCount === 'number' ? cur.nodeCount : nodes.length;
    var expanded = recordsCurrentExpanded;

    var toggle = makeEl('button', 'rec-row');
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', String(expanded));
    var line = makeEl('span', 'rec-line');
    line.appendChild(makeEl('span', 'rec-cur-label', 'Поточне'));
    var text = ': ' + formatTime(cur.receivedAt) + ' · ' + fileLabel(cur.fileKey) + ' · ' + count + ' ' + nodesWord(count);
    if (nodes.length) text += ' · ' + nodeName(nodes[0]);
    line.appendChild(makeEl('span', 'rec-first', text));
    toggle.appendChild(line);

    var detail = makeEl('div', 'rec-detail');
    detail.hidden = !expanded;
    nodes.forEach(function (n) {
      detail.appendChild(makeEl('div', 'rec-node', nodeLine(n)));
    });

    toggle.addEventListener('click', function () {
      recordsCurrentExpanded = !recordsCurrentExpanded;
      toggle.setAttribute('aria-expanded', String(recordsCurrentExpanded));
      detail.hidden = !recordsCurrentExpanded;
    });

    recordsCurrentEl.appendChild(toggle);
    recordsCurrentEl.appendChild(detail);
  }

  // ---- «Виділити у Figma»: restores a saved record's nodes in Figma (contract: select-nodes / select-result) ----

  var SELECT_LABEL = 'Виділити у Figma';
  var SELECT_TIMEOUT_MS = 5000;
  var selectSeq = 0;
  var selectPending = null; // {requestId, key, timer} while the plugin answers; null otherwise
  var selectMsgs = {}; // record key -> {text, kind} of its last result (session only)
  var cardSlots = []; // {key, btn, status} of the cards built by the last renderRecords
  var viewSlots = []; // {key, btn, status} of the record view built by the last renderRecordView

  // The node ids of a record: `ids` when the server sent it, else the ids of its nodes.
  function recordIds(r) {
    var list = Array.isArray(r.ids) ? r.ids : recordNodes(r).map(function (n) { return n.id; });
    return list.map(textOf).filter(function (id) { return id !== ''; });
  }

  // The text and the kind of a select-result. Partial and not-found are reported in words, not colour alone.
  function selectResultLine(msg) {
    var requested = typeof msg.requested === 'number' ? msg.requested : 0;
    var found = typeof msg.found === 'number' ? msg.found : requested;
    var text;
    var kind = 'err';
    if (msg.status === 'ok') {
      text = 'Виділено ' + found + ' ' + elementsWord(found) + ' у Figma';
      kind = 'ok';
    } else if (msg.status === 'partial') {
      text = 'Виділено ' + found + ' з ' + requested + ' (решту не знайдено або вони на іншій сторінці)';
      kind = '';
    } else if (msg.status === 'none') {
      text = 'Елементи не знайдено у Figma (можливо, видалені)';
    } else if (msg.status === 'other-file') {
      text = 'Цей запис з іншого файлу Figma. Відкрийте той файл';
    } else {
      text = 'Не вдалося виділити';
    }
    if (msg.switchedPage === true) {
      text += typeof msg.pageName === 'string' && msg.pageName
        ? ' · перейшли на сторінку «' + msg.pageName + '»'
        : ' · перейшли на іншу сторінку';
    }
    return { text: text, kind: kind };
  }

  // Shows the pending text, the last result of the record, or nothing; the button is off while its request runs.
  function paintSelectSlot(slot) {
    var pending = selectPending !== null && selectPending.key === slot.key;
    var msg = pending ? { text: 'Виділяю…', kind: '' } : selectMsgs[slot.key];
    slot.btn.disabled = pending;
    slot.status.textContent = msg ? msg.text : '';
    slot.status.className = 'status select-status' + (msg && msg.kind ? ' ' + msg.kind : '');
  }

  function paintSelectSlots() {
    cardSlots.concat(viewSlots).forEach(paintSelectSlot);
  }

  // A new request replaces the one in progress: its late reply is ignored (the requestId no longer matches).
  function selectInFigma(key, fileKey, ids) {
    var requestId = ++selectSeq;
    if (selectPending) clearTimeout(selectPending.timer);
    var timer = setTimeout(function () {
      if (!selectPending || selectPending.requestId !== requestId) return;
      selectPending = null;
      selectMsgs[key] = { text: 'Figma не відповіла', kind: 'err' };
      paintSelectSlots();
    }, SELECT_TIMEOUT_MS);
    selectPending = { requestId: requestId, key: key, timer: timer };
    paintSelectSlots();
    parent.postMessage({
      pluginMessage: { type: 'select-nodes', requestId: requestId, fileKey: fileKey, ids: ids }
    }, '*');
  }

  function onSelectResult(msg) {
    if (!selectPending || msg.requestId !== selectPending.requestId) return;
    var key = selectPending.key;
    clearTimeout(selectPending.timer);
    selectPending = null;
    selectMsgs[key] = selectResultLine(msg);
    paintSelectSlots();
  }

  // The button and its result line for one record; the slot is kept so the line can be painted later.
  function selectRowFor(r, slots) {
    var key = textOf(r.id);
    var fileKey = typeof r.fileKey === 'string' && r.fileKey ? r.fileKey : null;
    var ids = recordIds(r);
    var row = makeEl('div', 'select-row');
    var btn = makeEl('button', 'secondary', SELECT_LABEL);
    btn.type = 'button';
    var status = makeEl('span', 'status select-status');
    status.setAttribute('aria-live', 'polite');
    btn.addEventListener('click', function () {
      selectInFigma(key, fileKey, ids);
    });
    row.appendChild(btn);
    row.appendChild(status);
    var slot = { key: key, btn: btn, status: status };
    slots.push(slot);
    paintSelectSlot(slot);
    return row;
  }

  // ---- Record cards and the record view (session only) ----

  var CARD_NAMES = 3; // names on a card before «+N»
  var recordViewEl = document.getElementById('recordView');
  var recordBackEl = document.getElementById('recordBack');
  var recordViewBodyEl = document.getElementById('recordViewBody');
  var openedRecordKey = null; // the record shown in the record view; null: the list is shown
  var recordTechOpen = false; // the «Технічні дані» block of the opened record; collapsed on every open
  var recordOpenBtns = {}; // record key -> its card's open button (focus returns there after «Назад»)

  function findRecord(key) {
    if (!recordsData) return null;
    for (var i = 0; i < recordsData.length; i++) {
      if (recordsData[i] && textOf(recordsData[i].id) === key) return recordsData[i];
    }
    return null;
  }

  function recordNodes(r) {
    return Array.isArray(r.nodes) ? r.nodes.filter(function (n) { return n && typeof n === 'object'; }) : [];
  }

  function recordCount(r, nodes) {
    return typeof r.nodeCount === 'number' ? r.nodeCount : nodes.length;
  }

  // The status button of one record; the card and the record view both use it.
  function statusButtonFor(r) {
    var key = textOf(r.id);
    var done = r.status === 'done';
    var btn = makeEl('button', 'secondary', done ? 'Повернути в нові' : 'Позначити виконаним');
    btn.type = 'button';
    btn.disabled = recordStatusPending[key] === true;
    btn.addEventListener('click', function () {
      setRecordStatus(r.id, done ? 'new' : 'done');
    });
    return btn;
  }

  // The title line of a card: the first names with their type pills, then «+N», then «N елементів».
  function cardTitle(nodes, count) {
    var title = makeEl('span', 'rec-title');
    var shown = nodes.slice(0, CARD_NAMES);
    shown.forEach(function (n, i) {
      if (i > 0) title.appendChild(makeEl('span', 'rec-sep', ','));
      title.appendChild(nameChip(n, 'rec-el'));
    });
    if (!shown.length) title.appendChild(makeEl('span', 'rec-more', 'Без елементів'));
    if (count > shown.length) title.appendChild(makeEl('span', 'rec-more', '+' + (count - shown.length)));
    if (count > 1) title.appendChild(makeEl('span', 'rec-count', count + ' ' + elementsWord(count)));
    return title;
  }

  // One record as a card. The open part is a real button (click or Enter opens the record view);
  // the status button sits below it, so no button is nested in another.
  function buildRecordCard(r) {
    var key = textOf(r.id);
    var nodes = recordNodes(r);
    var count = recordCount(r, nodes);
    var note = typeof r.note === 'string' ? r.note.trim() : '';
    var done = r.status === 'done';

    var card = makeEl('div', done ? 'rec done' : 'rec');
    var open = makeEl('button', 'rec-open');
    open.type = 'button';
    open.appendChild(cardTitle(nodes, count));
    open.appendChild(note ? makeEl('span', 'rec-note', note) : makeEl('span', 'rec-note empty', 'Без коментаря'));
    var meta = makeEl('span', 'rec-meta');
    meta.appendChild(makeEl('span', 'rec-time', relativeTime(r.receivedAt, Date.now())));
    meta.appendChild(makeEl('span', done ? 'badge badge-done' : 'badge badge-new', done ? 'виконано' : 'нове'));
    open.appendChild(meta);
    open.addEventListener('click', function () {
      openRecord(key);
    });
    recordOpenBtns[key] = open;

    var actions = makeEl('div', 'rec-actions');
    actions.appendChild(statusButtonFor(r));
    actions.appendChild(selectRowFor(r, cardSlots));
    card.appendChild(open);
    card.appendChild(actions);
    return card;
  }

  function openRecord(key) {
    openedRecordKey = key;
    recordTechOpen = false;
    updateRecordsUi();
    recordBackEl.focus();
  }

  // «Назад до записів» and Escape: the list comes back and the card of the record gets the focus again.
  function closeRecord() {
    if (openedRecordKey === null) return;
    var key = openedRecordKey;
    openedRecordKey = null;
    updateRecordsUi();
    if (recordOpenBtns[key]) recordOpenBtns[key].focus();
  }

  // Builds the view of the opened record (empty when no record is open). Ids and file keys live only in «Технічні дані».
  function renderRecordView() {
    recordViewBodyEl.textContent = '';
    viewSlots = [];
    var r = openedRecordKey === null ? null : findRecord(openedRecordKey);
    if (!r) return;
    var key = textOf(r.id);
    var nodes = recordNodes(r);
    var count = recordCount(r, nodes);
    var note = typeof r.note === 'string' ? r.note : '';
    var done = r.status === 'done';
    var body = recordViewBodyEl;

    var title = makeEl('h2', 'rec-view-title');
    nodes.forEach(function (n) {
      title.appendChild(nameChip(n, 'rec-view-el'));
    });
    if (!nodes.length) title.appendChild(makeEl('span', 'rec-view-el', 'Без елементів'));
    if (count > nodes.length) title.appendChild(makeEl('span', 'rec-view-more', 'ще ' + (count - nodes.length)));
    body.appendChild(title);

    var meta = makeEl('div', 'rec-view-meta');
    meta.appendChild(makeEl('span', null, 'Отримано ' + formatDateTime(r.receivedAt)));
    meta.appendChild(makeEl('span', done ? 'badge badge-done' : 'badge badge-new', done ? 'виконано' : 'нове'));
    if (count > 1) meta.appendChild(makeEl('span', null, count + ' ' + elementsWord(count)));
    body.appendChild(meta);

    body.appendChild(makeEl('div', 'rec-view-label', 'Коментар'));
    body.appendChild(note.trim() !== ''
      ? makeEl('div', 'rec-view-note', note)
      : makeEl('div', 'rec-view-note empty', 'Без коментаря'));

    var actions = makeEl('div', 'rec-view-actions');
    actions.appendChild(statusButtonFor(r));
    actions.appendChild(selectRowFor(r, viewSlots));
    body.appendChild(actions);

    var techBtn = makeEl('button', 'link-btn', 'Технічні дані');
    techBtn.type = 'button';
    techBtn.setAttribute('aria-expanded', String(recordTechOpen));
    var tech = makeEl('div', 'rec-tech');
    tech.hidden = !recordTechOpen;
    techBtn.addEventListener('click', function () {
      recordTechOpen = !recordTechOpen;
      techBtn.setAttribute('aria-expanded', String(recordTechOpen));
      tech.hidden = !recordTechOpen;
    });
    body.appendChild(techBtn);
    tech.appendChild(makeEl('div', 'rec-tech-line', 'id: ' + key));
    tech.appendChild(makeEl('div', 'rec-tech-line', 'fileKey: ' + (typeof r.fileKey === 'string' && r.fileKey ? r.fileKey : 'немає')));
    tech.appendChild(makeEl('div', 'rec-tech-line', 'nodeCount: ' + count));
    tech.appendChild(makeEl('div', 'rec-tech-line', 'hasDetail: ' + String(r.hasDetail === true)));
    nodes.forEach(function (n) {
      tech.appendChild(makeEl('div', 'rec-tech-line', nodeLine(n)));
    });
    body.appendChild(tech);
  }

  // Rebuilds the list of cards (and the view, if one is open). A record that is gone closes the view.
  function renderRecords() {
    renderCurrent();
    recordsListEl.textContent = '';
    recordOpenBtns = {};
    cardSlots = [];
    if (recordsData && openedRecordKey !== null && !findRecord(openedRecordKey)) openedRecordKey = null;
    if (recordsData) {
      if (!recordsData.length) recordsListEl.appendChild(makeEl('div', 'records-empty', 'Записів ще немає'));
      recordsData.forEach(function (r) {
        recordsListEl.appendChild(buildRecordCard(r));
      });
    }
    updateRecordsUi();
  }

  // GETs /records with x-token. Never rejects; a failure only sets the section's status line.
  // A response that is superseded (or arrives after the settings were turned off) is ignored.
  function refreshRecords() {
    if (!recordsActive()) {
      updateRecordsUi();
      return Promise.resolve(false);
    }
    var token = tokenEl.value.trim();
    var seq = ++recordsSeq;
    var controller = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () {
      if (controller) controller.abort();
    }, RECORDS_TIMEOUT_MS);
    setRecordsStatus('Завантаження…', '');
    return Promise.resolve()
      .then(function () {
        return fetch(RECORDS_URL, {
          method: 'GET',
          headers: { 'x-token': token },
          signal: controller ? controller.signal : undefined
        });
      })
      .then(function (res) {
        if (res && res.status === 401) return { error: 'Невірний токен' };
        if (!res || !res.ok) return { error: 'Помилка читання записів' };
        return res.json().then(function (body) {
          if (!body || body.ok !== true || !Array.isArray(body.records)) return { error: 'Помилка читання записів' };
          var current = body.current && typeof body.current === 'object' ? body.current : null;
          return { records: body.records, current: current };
        });
      }, function () {
        return { error: 'Сервер не запущений' };
      })
      .catch(function () {
        return { error: 'Помилка читання записів' };
      })
      .then(function (result) {
        clearTimeout(timer);
        if (seq !== recordsSeq || !recordsActive()) return false;
        if (result.error) {
          setRecordsStatus(result.error, 'err');
          return false;
        }
        recordsData = result.records;
        recordsCurrent = result.current;
        setRecordsStatus('', '');
        renderRecords();
        updateRecordsUi();
        return true;
      });
  }

  // POSTs the new status of one saved record. On success the list is fetched again (so the count and the badge follow);
  // on failure only the section's status line says why. Never rejects.
  function setRecordStatus(id, status) {
    if (!recordsActive()) return Promise.resolve(false);
    var key = String(id);
    if (recordStatusPending[key] === true) return Promise.resolve(false);
    var token = tokenEl.value.trim();
    recordStatusPending[key] = true;
    renderRecords(); // disables this record's button while the request is in flight
    var controller = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () {
      if (controller) controller.abort();
    }, RECORD_STATUS_TIMEOUT_MS);
    return Promise.resolve()
      .then(function () {
        return fetch(RECORDS_URL + '/' + encodeURIComponent(key) + '/status', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-token': token },
          body: JSON.stringify({ status: status }),
          signal: controller ? controller.signal : undefined
        });
      })
      .then(function (res) {
        if (res && res.status === 401) return 'Невірний токен';
        if (res && res.status === 404) return 'Запис не знайдено';
        if (res && res.status === 400) return 'Некоректний статус';
        if (!res || !res.ok) return 'Помилка оновлення статусу';
        return null;
      }, function () {
        return 'Сервер не запущений';
      })
      .catch(function () {
        return 'Помилка оновлення статусу';
      })
      .then(function (error) {
        clearTimeout(timer);
        delete recordStatusPending[key];
        if (!recordsActive()) return false; // sending was turned off meanwhile: the response is ignored
        renderRecords();
        if (error) {
          setRecordsStatus(error, 'err');
          return false;
        }
        refreshRecords();
        return true;
      });
  }

  function cancelRecordsRefresh() {
    clearTimeout(recordsDebounce);
    recordsDebounce = null;
  }

  // Typing a token refreshes once after a short pause, not on every key.
  function scheduleRecordsRefresh() {
    cancelRecordsRefresh();
    recordsDebounce = setTimeout(function () {
      recordsDebounce = null;
      refreshRecords();
    }, RECORDS_DEBOUNCE_MS);
  }

  // Turning sending off drops any list request in flight. Turning it on does not fetch by itself.
  function recordsSendChanged() {
    if (!recordsActive()) {
      recordsSeq++; // drops any response still in flight
      cancelRecordsRefresh();
      setRecordsStatus('', '');
    }
    updateRecordsUi();
  }

  function recordsTokenChanged() {
    if (!recordsActive()) {
      recordsSendChanged();
      return;
    }
    updateRecordsUi();
    scheduleRecordsRefresh();
  }

  // Selects one of the three tabs ("selection", "records", "settings"). Opening the records tab fetches the list;
  // re-selecting it does not.
  function selectTab(name) {
    var wasRecords = activeTab === 'records';
    activeTab = name;
    TAB_ORDER.forEach(function (key) {
      var on = key === name;
      tabEls[key].tab.setAttribute('aria-selected', String(on));
      tabEls[key].tab.tabIndex = on ? 0 : -1;
      tabEls[key].panel.hidden = !on;
    });
    if (name === 'records' && !wasRecords) refreshRecords();
  }

  function buildText(format, fileKey, nodes) {
    if (format === 'idname') {
      return nodes.map(function (n) { return n.id + ' "' + n.name + '"'; }).join('\n');
    }
    if (format === 'link') {
      if (!fileKey) {
        return nodes.map(function (n) { return n.id; }).join('\n');
      }
      return nodes.map(function (n) {
        return 'https://www.figma.com/design/' + fileKey + '/?node-id=' + String(n.id).replace(/:/g, '-');
      }).join('\n');
    }
    if (format === 'claude') {
      return ['Figma nodes:'].concat(nodes.map(function (n) {
        return n.id + ' "' + n.name + '" (' + n.type + ')';
      })).join('\n');
    }
    return nodes.map(function (n) { return n.id; }).join('\n');
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    ta.remove();
    return ok;
  }

  function copyText(text) {
    var clip = navigator.clipboard;
    var attempt = (clip && typeof clip.writeText === 'function')
      ? clip.writeText(text).then(function () { return true; }, function () { return false; })
      : Promise.resolve(false);
    return attempt.then(function (ok) {
      return ok ? true : fallbackCopy(text);
    });
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function setSendStatus(text, kind) {
    sendStatusEl.textContent = text;
    sendStatusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  // Persists the send checkbox, the token and the copy format through the plugin's clientStorage.
  function saveSettings() {
    parent.postMessage({
      pluginMessage: { type: 'save-settings', settings: { send: sendEl.checked, token: tokenEl.value, format: formatEl.value } }
    }, '*');
  }

  // The header dot mirrors the server state. Green = working; red = not reachable or token not accepted;
  // grey = sending is off, or the first check is still running. The label names the state (not colour alone).
  function setHealthDot(key) {
    var s = HEALTH_STATES[key];
    var dotClass = key === 'ok' ? 'ok' : (s ? 'err' : 'off');
    var label = 'Стан сервера: ' + (s ? s.text.replace(/^● /, '') : key === 'checking' ? 'перевірка…' : 'надсилання в Claude вимкнено');
    healthDotEl.className = 'health-dot ' + dotClass;
    healthDotEl.setAttribute('aria-label', label);
    healthDotEl.setAttribute('title', label);
  }

  // Shows one of HEALTH_STATES, or hides the line when state is null (sending is off).
  function setHealth(state) {
    var s = state ? HEALTH_STATES[state] : null;
    setHealthDot(s ? state : 'off');
    if (!s) {
      healthEl.hidden = true;
      healthEl.textContent = '';
      healthEl.className = 'health';
      return;
    }
    healthEl.hidden = false;
    healthEl.textContent = s.text;
    healthEl.className = 'health ' + s.kind;
  }

  // GETs /health and renders the result. Never rejects; any failure means "not running".
  function checkHealth() {
    if (!sendEl.checked) return Promise.resolve();
    var token = tokenEl.value.trim();
    var seq = ++healthSeq;
    var controller = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () {
      if (controller) controller.abort();
    }, HEALTH_TIMEOUT_MS);
    return Promise.resolve()
      .then(function () {
        return fetch(HEALTH_URL, {
          method: 'GET',
          headers: { 'x-token': token },
          signal: controller ? controller.signal : undefined
        });
      })
      .then(function (res) {
        if (!res || !res.ok) throw new Error('bad response');
        return res.json();
      })
      .then(function (body) {
        if (!body || body.ok !== true) return 'down';
        if (!token) return 'noToken';
        return body.authorized === true ? 'ok' : 'badToken';
      }, function () {
        return 'down';
      })
      .then(function (state) {
        clearTimeout(timer);
        if (seq === healthSeq && sendEl.checked) setHealth(state);
      });
  }

  function startHealth() {
    stopHealth();
    checkHealth();
    healthTimer = setInterval(checkHealth, HEALTH_INTERVAL_MS);
  }

  function stopHealth() {
    if (healthTimer !== null) clearInterval(healthTimer);
    healthTimer = null;
    clearTimeout(healthDebounce);
    healthDebounce = null;
    healthSeq++; // discards any in-flight result
  }

  // Polls only while the send checkbox is on.
  function syncHealth() {
    if (sendEl.checked) {
      setHealthDot('checking');
      startHealth();
    } else {
      stopHealth();
      setHealth(null);
    }
  }

  // Re-checks shortly after the token changes, so typing does not fire a request per key.
  function scheduleHealthCheck() {
    if (!sendEl.checked) return;
    clearTimeout(healthDebounce);
    healthDebounce = setTimeout(function () {
      healthDebounce = null;
      checkHealth();
    }, HEALTH_DEBOUNCE_MS);
  }

  function applySettings(settings) {
    if (!settings || typeof settings !== 'object') return;
    if (typeof settings.send !== 'boolean' || typeof settings.token !== 'string') return;
    sendEl.checked = settings.send;
    tokenEl.value = settings.token;
    // format is optional: older stored settings have none, and an unknown value keeps the current choice.
    if (FORMAT_VALUES.indexOf(settings.format) !== -1) formatEl.value = settings.format;
    syncHealth();
    updateDetailUi();
    refreshRecords(); // on start: loads the list when sending is on (does nothing when it is off)
  }

  // Keeps server text short enough for the status line; plain text only (set via textContent).
  function clipServerText(text) {
    var s = typeof text === 'string' ? text.trim() : '';
    return s.length > 120 ? s.slice(0, 119) + '…' : s;
  }

  function detailSavedText(nodes) {
    if (!Number.isInteger(nodes) || nodes < 0) return 'Деталі збережено';
    return 'Деталі збережено (' + nodes + ' ' + nodesWord(nodes) + ')';
  }

  // Reads the server's answer to a detail POST. The server answers 200 even when it rejects the detail,
  // so only detail.stored === true counts as saved. A body that cannot be parsed counts as a failed request.
  function readDetailAck(res) {
    return Promise.resolve()
      .then(function () { return res.json(); })
      .then(function (body) {
        var d = body && typeof body === 'object' ? body.detail : null;
        if (!d || typeof d !== 'object') return { result: 'unconfirmed' };
        if (d.stored === true) return { result: 'stored', nodes: d.nodes };
        if (d.stored === false) return { result: 'rejected', message: clipServerText(d.error) };
        return { result: 'unconfirmed' };
      }, function () {
        return { result: 'failed' };
      });
  }

  // POSTs the selection to the local server. Never rejects; failures only set the status lines.
  // opts is used by the detail flow only: {detail, note, startText}.
  // Resolves true when the server accepted the request (for a detail POST: when it stored the detail).
  function sendToClaude(fileKey, nodes, opts) {
    opts = opts || {};
    var token = tokenEl.value.trim();
    if (!sendEl.checked || !token) {
      setSendStatus('', '');
      return Promise.resolve(false);
    }
    var seq = ++sendSeq;
    var controller = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () {
      if (controller) controller.abort();
    }, SEND_TIMEOUT_MS);
    setSendStatus(opts.startText || 'Надсилання…', '');
    var payload = {
      fileKey: fileKey,
      nodes: nodes.map(function (n) { return { id: n.id, name: n.name, type: n.type }; })
    };
    if ('detail' in opts) payload.detail = opts.detail;
    if (opts.note) payload.note = opts.note;
    var body = JSON.stringify(payload);
    return Promise.resolve()
      .then(function () {
        return fetch(SEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-token': token },
          body: body,
          signal: controller ? controller.signal : undefined
        });
      })
      .then(function (res) {
        if (res && res.status === 401) return { result: 'unauthorized' };
        if (!res || !res.ok) return { result: 'failed' };
        if (!('detail' in opts)) return { result: 'sent' };
        return readDetailAck(res);
      }, function () {
        return { result: 'network' };
      })
      .then(function (outcome) {
        clearTimeout(timer);
        var r = outcome.result;
        var ok = r === 'sent' || r === 'stored';
        if (seq === sendSeq) {
          var text = 'Помилка надсилання';
          if (r === 'sent') text = 'Надіслано';
          else if (r === 'stored') text = detailSavedText(outcome.nodes);
          else if (r === 'rejected') text = 'Деталі не збережено' + (outcome.message ? ': ' + outcome.message : '');
          else if (r === 'unconfirmed') text = 'Сервер не підтвердив збереження деталей';
          setSendStatus(text, ok ? 'ok' : 'err');
          if (r === 'unauthorized' && sendEl.checked) setHealth('badToken');
          if (r === 'network' && sendEl.checked) setHealth('down');
        }
        // Only a stored detail can add or change a saved record, so only it refreshes the list.
        // Plain selection POSTs change just "current" and leave the list alone. The count stays current off-tab too.
        if (ok && 'detail' in opts) refreshRecords();
        return ok;
      });
  }

  // Canonical form of a set of node ids: sorted, so the order of the ids does not matter.
  function idsKey(ids) {
    return JSON.stringify(ids.map(String).sort());
  }

  function selectedIdsKey() {
    return idsKey(state.nodes.map(function (n) { return n.id; }));
  }

  function canRequestDetail() {
    return sendEl.checked && tokenEl.value.trim() !== '' && state.nodes.length > 0;
  }

  // Keeps the detail button in step with the send settings, the selection and any request in progress.
  function updateDetailUi() {
    var enabled = canRequestDetail() && !detail;
    detailBtn.disabled = !enabled;
    expandEl.disabled = !enabled;
    commentCountEl.textContent = commentEl.value.length + '/' + COMMENT_MAX;
  }

  function clearComment() {
    commentEl.value = '';
    updateDetailUi();
  }

  // Drops the request that is still waiting for its reply (the selection or the send setting changed).
  function cancelDetail() {
    if (!detail) return;
    if (detail.timer !== null) clearTimeout(detail.timer);
    if (!detail.posting && sendStatusEl.textContent === DETAIL_WAIT_TEXT) setSendStatus('', '');
    detail = null;
  }

  // Asks the plugin for the detail of the current selection. The detail always goes with the comment text;
  // an empty comment sends no note.
  function requestDetail() {
    if (detail || !canRequestDetail()) return;
    var id = ++detailSeq;
    var raw = commentEl.value;
    detail = {
      requestId: id,
      key: selectedIdsKey(),
      note: raw.trim(),
      commentRaw: raw,
      posting: false,
      timer: null
    };
    detail.timer = setTimeout(function () {
      if (!detail || detail.requestId !== id) return;
      detail = null;
      setSendStatus('Таймаут збору деталей', 'err');
      updateDetailUi();
    }, DETAIL_TIMEOUT_MS);
    setSendStatus(DETAIL_WAIT_TEXT, '');
    updateDetailUi();
    parent.postMessage({
      pluginMessage: { type: 'request-detail', requestId: id, expandInstances: expandEl.checked === true }
    }, '*');
  }

  // The plugin's detail reply. Only the reply to the current request for the current ids is sent.
  function onDetailReply(msg) {
    if (!detail || detail.posting || msg.requestId !== detail.requestId) return;
    if (!Array.isArray(msg.ids) || idsKey(msg.ids) !== detail.key || selectedIdsKey() !== detail.key) return;
    var current = detail;
    clearTimeout(current.timer);
    current.timer = null;
    current.posting = true;
    updateDetailUi();
    var opts = { detail: msg.detail, startText: DETAIL_WAIT_TEXT };
    if (current.note) opts.note = current.note;
    sendToClaude(state.fileKey, state.nodes, opts).then(function (ok) {
      if (detail === current) detail = null;
      if (ok && commentEl.value === current.commentRaw) clearComment();
      updateDetailUi();
    });
  }

  function onDetailError(msg) {
    if (!detail || detail.posting || msg.requestId !== detail.requestId) return;
    clearTimeout(detail.timer);
    detail = null;
    setSendStatus(typeof msg.message === 'string' && msg.message ? msg.message : 'Помилка збору деталей', 'err');
    updateDetailUi();
  }

  function copySelection() {
    if (!state.nodes.length) return Promise.resolve(false);
    var text = buildText(formatEl.value, state.fileKey, state.nodes);
    return copyText(text).then(function (ok) {
      if (ok) {
        setStatus('Скопійовано', 'ok');
        parent.postMessage({ pluginMessage: { type: 'notify', message: 'Скопійовано' } }, '*');
      } else {
        setStatus('Помилка копіювання', 'err');
      }
      return ok;
    });
  }

  // Collapse: hides everything except the header row. Session only, never persisted.
  var countWrapEl = document.getElementById('countWrap');
  var summaryEl = document.getElementById('summary');
  var collapseBtn = document.getElementById('collapseBtn');
  var collapsed = false;

  // While collapsed the header shows the node count as a short summary.
  function renderHeader() {
    var n = state.nodes.length;
    countWrapEl.hidden = collapsed;
    summaryEl.hidden = !collapsed;
    summaryEl.textContent = n ? n + ' ' + nodesWord(n) : 'Нічого не вибрано';
  }

  function setCollapsed(next) {
    collapsed = next;
    document.body.className = collapsed ? 'collapsed' : '';
    collapseBtn.textContent = collapsed ? '▸ Розгорнути' : '▾ Згорнути';
    collapseBtn.setAttribute('aria-expanded', String(!collapsed));
    renderHeader();
    parent.postMessage({ pluginMessage: { type: 'resize', collapsed: collapsed } }, '*');
  }

  function render() {
    countEl.textContent = String(state.nodes.length);
    // More than COMPACT_AFTER selected nodes: one-line rows, children collapsed behind a toggle.
    var compact = state.nodes.length > COMPACT_AFTER;
    listEl.className = compact ? 'list compact' : 'list';
    listEl.textContent = '';
    if (!state.nodes.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Нічого не вибрано';
      listEl.appendChild(empty);
    } else {
      state.nodes.forEach(function (n) {
        listEl.appendChild(buildSelectionRow(n, compact));
      });
    }
    copyBtn.disabled = !state.nodes.length;
    renderHeader();
    updateDetailUi();
  }

  window.addEventListener('message', function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'settings') {
      applySettings(msg.settings);
      return;
    }
    if (msg.type === 'detail') {
      onDetailReply(msg);
      return;
    }
    if (msg.type === 'detail-error') {
      onDetailError(msg);
      return;
    }
    if (msg.type === 'select-result') {
      onSelectResult(msg);
      return;
    }
    if (msg.type !== 'selection') return;

    state.fileKey = typeof msg.fileKey === 'string' ? msg.fileKey : null;
    state.nodes = Array.isArray(msg.nodes)
      ? msg.nodes.filter(function (n) { return n && n.id != null; })
      : [];

    // The comment, any pending detail request and the expanded children belong to the set of selected ids.
    var key = selectedIdsKey();
    if (key !== selectionKey) {
      selectionKey = key;
      childExpanded = {};
      childOpen = {};
      clearComment();
      cancelDetail();
    }

    render();
    setStatus('', '');

    var signature = JSON.stringify([state.fileKey, state.nodes.map(function (n) { return n.id; })]);
    var isNew = signature !== lastSignature;
    lastSignature = signature;

    if (isNew && autoEl.checked && userGestured && state.nodes.length) {
      copySelection();
    }

    // Every selection message is sent, including an empty one (nodes: []).
    sendToClaude(state.fileKey, state.nodes);
  });

  // Browsers only allow clipboard writes after a user gesture.
  document.addEventListener('click', function () {
    userGestured = true;
  }, true);

  copyBtn.addEventListener('click', function () {
    copySelection();
  });

  sendEl.addEventListener('change', function () {
    saveSettings();
    syncHealth();
    if (!sendEl.checked) cancelDetail();
    updateDetailUi();
    recordsSendChanged();
  });
  tokenEl.addEventListener('input', function () {
    saveSettings();
    scheduleHealthCheck();
    updateDetailUi();
    recordsTokenChanged();
  });
  formatEl.addEventListener('change', function () {
    saveSettings();
  });

  tabSelectionEl.addEventListener('click', function () {
    selectTab('selection');
  });
  tabRecordsEl.addEventListener('click', function () {
    selectTab('records');
  });
  tabSettingsEl.addEventListener('click', function () {
    selectTab('settings');
  });
  // The header dot opens the settings tab, where the server state is also written out.
  healthDotEl.addEventListener('click', function () {
    selectTab('settings');
    tabSettingsEl.focus();
  });
  // Arrow keys move to the neighbouring tab (wrapping), Home and End to the first and last tab;
  // Enter and Space come from the buttons (the ARIA tabs pattern).
  tablistEl.addEventListener('keydown', function (e) {
    var at = TAB_ORDER.indexOf(activeTab);
    var target = null;
    if (e.key === 'ArrowRight') target = TAB_ORDER[(at + 1) % TAB_ORDER.length];
    else if (e.key === 'ArrowLeft') target = TAB_ORDER[(at + TAB_ORDER.length - 1) % TAB_ORDER.length];
    else if (e.key === 'Home') target = TAB_ORDER[0];
    else if (e.key === 'End') target = TAB_ORDER[TAB_ORDER.length - 1];
    if (!target) return;
    e.preventDefault();
    selectTab(target);
    tabEls[target].tab.focus();
  });

  collapseBtn.addEventListener('click', function () {
    setCollapsed(!collapsed);
  });
  recordsRefreshEl.addEventListener('click', function () {
    refreshRecords();
  });
  recordBackEl.addEventListener('click', function () {
    closeRecord();
  });
  // Escape closes the record view (a no-op while the list is shown).
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeRecord();
  });

  detailBtn.addEventListener('click', function () {
    requestDetail();
  });
  commentEl.addEventListener('input', function () {
    if (commentEl.value.length > COMMENT_MAX) commentEl.value = commentEl.value.slice(0, COMMENT_MAX);
    updateDetailUi();
  });

  setHealthDot('off');
  render();
  updateRecordsUi();
})();
</script>
</body>
</html>
