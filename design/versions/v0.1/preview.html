<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Версія 0.1 — попередній перегляд</title>
<style>
  :root {
    --page-bg: #e5e5e5;
    --caption: #333333;
    --btn-bg: #ffffff;
    --btn-fg: #222222;
    --btn-border: #bdbdbd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #2b2b2b;
      --caption: #e0e0e0;
      --btn-bg: #3a3a3a;
      --btn-fg: #f0f0f0;
      --btn-border: #555555;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #2b2b2b;
    --caption: #e0e0e0;
    --btn-bg: #3a3a3a;
    --btn-fg: #f0f0f0;
    --btn-border: #555555;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page-bg);
    color: var(--caption);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px 16px;
    box-sizing: border-box;
  }
  .caption { margin: 0; font-weight: 600; text-align: center; }
  iframe {
    border: 1px solid var(--btn-border);
    background: #ffffff;
    max-width: 100%;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button {
    font: inherit;
    padding: 6px 12px;
    border: 1px solid var(--btn-border);
    border-radius: 6px;
    background: var(--btn-bg);
    color: var(--btn-fg);
    cursor: pointer;
  }
</style>
</head>
<body>
  <p class="caption">Версія 0.1 — як було до налаштувань</p>

  <iframe id="plugin" src="ui.html" width="380" height="520" title="Плагін, версія 0.1"></iframe>

  <div class="row">
    <button type="button" id="btn-selection">Повторити демо-вибір</button>
  </div>
  <div class="row">
    <button type="button" id="btn-empty">Порожній вибір</button>
  </div>

  <script>
    (function () {
      var frame = document.getElementById('plugin');

      var demoSettings = {
        pluginMessage: { type: 'settings', settings: { send: false, token: '' } }
      };

      var demoSelection = {
        pluginMessage: {
          type: 'selection',
          fileKey: 'AbC123demoFileKey',
          nodes: [
            { id: '12:34', name: 'Hero / Container', type: 'FRAME' },
            { id: '12:35', name: 'Button Primary', type: 'INSTANCE' },
            { id: '12:36', name: 'Title', type: 'TEXT' }
          ]
        }
      };

      var emptySelection = {
        pluginMessage: { type: 'selection', fileKey: 'AbC123demoFileKey', nodes: [] }
      };

      function post(data) {
        if (frame.contentWindow) {
          frame.contentWindow.postMessage(data, '*');
        }
      }

      frame.addEventListener('load', function () {
        post(demoSettings);
        post(demoSelection);
      });

      document.getElementById('btn-selection').addEventListener('click', function () {
        post(demoSelection);
      });

      document.getElementById('btn-empty').addEventListener('click', function () {
        post(emptySelection);
      });
    })();
  </script>
</body>
</html>
